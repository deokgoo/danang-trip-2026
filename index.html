<!DOCTYPE html>
<html lang="ko" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다낭 퍼펙트 가이드 · 2026.11</title>
  <meta name="description" content="2026년 11월 28일 출발 다낭 가족여행 — 일자별 완벽 가이드">

  <!-- Pretendard Font (가장 정갈하고 모던한 산세리프) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#2dd4bf',
              amber: '#fbbf24',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #090a0f;
      color: #f4f4f5;
      -webkit-font-smoothing: antialiased;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-teal-500/30 selection:text-teal-200">

  <!-- ================= TOP HEADER ================= -->
  <header class="bg-[#090a0f]/85 backdrop-blur-md border-b border-zinc-800/80 sticky top-0 z-40">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]"></span>
        <span class="font-bold text-zinc-100 tracking-tight text-sm sm:text-base">다낭 가족여행 2026</span>
      </div>
      <div id="d-day-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-zinc-900 text-zinc-300 border border-zinc-800">
        D-Day 계산 중
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6 space-y-6">

    <!-- ================= TRIP SUMMARY HERO CARD ================= -->
    <div class="bg-zinc-900/70 rounded-3xl p-6 sm:p-7 border border-zinc-800/90 shadow-2xl backdrop-blur-md space-y-6">
      <div class="space-y-2">
        <div class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-teal-400 bg-teal-950/60 border border-teal-800/50 px-2.5 py-1 rounded-full">
          <span>🇻🇳</span> DANANG · HOI AN
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight" id="hero-title">
          다낭 퍼펙트 가이드
        </h1>
        <p class="text-sm text-zinc-400 leading-relaxed" id="hero-subtitle">
          도착 첫날 시내 몰아보기부터 호이안 등불까지, 4일차 일자별 완벽 코스
        </p>
      </div>

      <!-- Date Banner -->
      <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-zinc-950/70 border border-zinc-800/80 text-xs sm:text-sm text-zinc-300">
        <div class="w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-base shadow-xs">
          📅
        </div>
        <div class="flex-1 font-medium">
          <span class="font-bold text-white">2026.11.28 (토)</span> 출발 — <span class="font-bold text-white">12.01 (화)</span> 귀국
          <span class="text-zinc-500 block sm:inline sm:ml-1 text-xs font-normal">(3박 4일)</span>
        </div>
      </div>

      <!-- Quick Facts 4-Grid -->
      <div id="hero-facts" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1 border-t border-zinc-800/60">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- ================= FILTER TABS ================= -->
    <div class="sticky top-[57px] z-30 -mx-4 px-4 py-2 bg-[#090a0f]/90 backdrop-blur-md border-b border-zinc-800/60">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1" id="tab-buttons">
        <!-- Day Tabs rendered by JS -->
      </div>
    </div>

    <!-- ================= ITINERARY LIST ================= -->
    <section id="itinerary-section" class="space-y-8">
      <!-- Days rendered by JS -->
    </section>

    <!-- ================= TIPS SECTION ================= -->
    <section id="tips-section" class="space-y-4 pt-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-zinc-100 flex items-center gap-2">
          <span>💡</span> 여행 필수 팁
        </h2>
        <span class="text-xs text-zinc-500">여행 전 필독</span>
      </div>

      <div id="tips-list" class="grid grid-cols-1 gap-3">
        <!-- Tips rendered by JS -->
      </div>
    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="max-w-2xl mx-auto px-4 pt-12 pb-8 text-center text-xs text-zinc-500 space-y-1">
    <p>2026.11.28 다낭 가족여행 가이드</p>
    <p id="footer-author" class="font-medium text-zinc-400">Kim Deokgoo & Family</p>
  </footer>

  <!-- ================= JAVASCRIPT ================= -->
  <script src="data.js"></script>
  <script>
    let activeDayFilter = 'all'; // 'all' or day number (1, 2, 3, 4) or 'tips'

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof TRIP_DATA === 'undefined') {
        alert('data.js 파일을 찾을 수 없습니다.');
        return;
      }

      renderHero();
      renderTabs();
      renderItinerary();
      renderTips();
      calculateDDay();
      fetchLiveWeather();
    });

    // D-Day 계산
    function calculateDDay() {
      const tripDate = new Date('2026-11-28T00:00:00');
      const today = new Date();
      const diffTime = tripDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      const badge = document.getElementById('d-day-badge');
      if (diffDays > 0) {
        badge.innerHTML = `<span class="text-teal-400 font-bold">D-${diffDays}</span> (${tripDate.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' })} 출발)`;
      } else if (diffDays === 0) {
        badge.innerHTML = `<span class="text-rose-400 font-extrabold animate-pulse">오늘 출발! ✈️</span>`;
      } else {
        badge.textContent = `여행 완료`;
      }
    }

    // 헤더 및 메타 렌더링
    function renderHero() {
      const { meta } = TRIP_DATA;
      if (!meta) return;

      if (meta.title) document.getElementById('hero-title').textContent = meta.title;
      if (meta.subtitle) document.getElementById('hero-subtitle').textContent = meta.subtitle;
      if (meta.author) document.getElementById('footer-author').textContent = meta.author;

      if (meta.facts) {
        const factsEl = document.getElementById('hero-facts');
        factsEl.innerHTML = meta.facts.map(f => `
          <div class="p-3 rounded-2xl bg-zinc-950/60 border border-zinc-800/80 text-center hover:border-zinc-700/80 transition">
            <div class="text-xl mb-1">${f.icon}</div>
            <div class="text-[11px] font-medium text-zinc-500">${f.label}</div>
            <div class="text-xs font-bold text-zinc-200 truncate mt-0.5">${f.value}</div>
          </div>
        `).join('');
      }
    }

    // 탭 버튼 렌더링
    function renderTabs() {
      const { days } = TRIP_DATA;
      const tabContainer = document.getElementById('tab-buttons');

      const tabs = [
        { id: 'all', label: '전체 일정' },
        ...days.map(d => ({ id: d.day, label: `Day ${d.day}` })),
        { id: 'tips', label: '💡 팁' }
      ];

      tabContainer.innerHTML = tabs.map(t => {
        const isActive = activeDayFilter === t.id;
        return `
          <button
            onclick="setDayFilter('${t.id}')"
            class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
              isActive
                ? 'bg-zinc-100 text-zinc-950 shadow-md font-bold'
                : 'bg-zinc-900/90 text-zinc-400 border border-zinc-800 hover:text-zinc-200 hover:bg-zinc-800/90'
            }"
          >
            ${t.label}
          </button>
        `;
      }).join('');
    }

    // 탭 필터 변경
    function setDayFilter(dayId) {
      activeDayFilter = dayId === 'all' || dayId === 'tips' ? dayId : Number(dayId);
      renderTabs();

      const itinerarySec = document.getElementById('itinerary-section');
      const tipsSec = document.getElementById('tips-section');

      if (activeDayFilter === 'tips') {
        itinerarySec.classList.add('hidden');
        tipsSec.classList.remove('hidden');
        tipsSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        itinerarySec.classList.remove('hidden');
        tipsSec.classList.remove('hidden');
        renderItinerary();
        window.scrollTo({ top: 300, behavior: 'smooth' });
      }
    }

    // 일정 렌더링
    function renderItinerary() {
      const { days } = TRIP_DATA;
      const container = document.getElementById('itinerary-section');

      const filteredDays = activeDayFilter === 'all'
        ? days
        : days.filter(d => d.day === activeDayFilter);

      container.innerHTML = filteredDays.map(day => `
        <div class="space-y-4">
          <!-- Day Title Card & Weather -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-zinc-900/60 border border-zinc-800/80">
            <div class="flex items-center gap-3 min-w-0">
              <div class="flex-shrink-0 w-11 h-11 rounded-2xl bg-zinc-800 border border-zinc-700/80 text-white flex flex-col items-center justify-center shadow-md">
                <span class="text-[9px] font-bold text-zinc-400 tracking-wider">DAY</span>
                <span class="text-lg font-black leading-none">${day.day}</span>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-teal-300 bg-teal-950/70 px-2 py-0.5 rounded-md border border-teal-800/50">${day.date}</span>
                  <h3 class="text-base sm:text-lg font-extrabold text-white truncate">${day.theme}</h3>
                </div>
                <p class="text-xs text-zinc-400 mt-0.5 line-clamp-1">${day.summary}</p>
              </div>
            </div>

            <!-- Weather Widget for this Day -->
            <div id="weather-day-${day.day}" class="flex-shrink-0 flex items-center justify-between sm:justify-end gap-3 px-3 py-1.5 rounded-xl bg-zinc-950/80 border border-zinc-800/90 text-xs">
              ${renderWeatherSnippet(day.weather)}
            </div>
          </div>

          <!-- Timeline Items -->
          <div class="relative pl-6 sm:pl-7 border-l-2 border-zinc-800/90 ml-5 sm:ml-5 space-y-3">
            ${day.stops.map(stop => {
              const isHl = stop.highlight;
              const mapQuery = stop.coords ? encodeURIComponent(stop.coords) : encodeURIComponent(stop.title.replace(/[\(\)]/g, ''));
              return `
                <div class="relative">
                  <!-- Timeline Node Dot -->
                  <div class="absolute -left-[31px] sm:-left-[35px] top-4 w-3 h-3 rounded-full bg-[#090a0f] border-2 ${
                    isHl ? 'border-amber-400 ring-4 ring-amber-400/20' : 'border-zinc-600'
                  }"></div>

                  <!-- Stop Card -->
                  <div class="rounded-2xl p-4 sm:p-5 border transition-all ${
                    isHl
                      ? 'border-amber-500/40 bg-gradient-to-r from-amber-500/[0.08] to-zinc-900/60 shadow-lg hover:border-amber-500/60'
                      : 'border-zinc-800/80 bg-zinc-900/50 shadow-sm hover:border-zinc-700 hover:bg-zinc-900/80'
                  }">

                    <!-- Time & Tag Row -->
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-xs font-bold px-2.5 py-0.5 rounded-md ${
                          isHl
                            ? 'bg-amber-400/15 border border-amber-400/30 text-amber-300'
                            : 'bg-zinc-800 text-zinc-300 border border-zinc-700/60'
                        }">
                          ${stop.time}
                        </span>
                        <span class="text-lg">${stop.emoji || '📍'}</span>
                      </div>

                      <div class="flex items-center gap-1.5">
                        ${stop.tag ? `
                          <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-amber-400 text-zinc-950">
                            ${stop.tag}
                          </span>
                        ` : ''}
                        <!-- Google Maps Quick Link -->
                        <a
                          href="https://www.google.com/maps/search/?api=1&query=${mapQuery}"
                          target="_blank"
                          rel="noopener noreferrer"
                          title="구글 지도에서 검색"
                          class="p-1 rounded-md text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition text-xs flex items-center gap-0.5"
                        >
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                          </svg>
                          <span class="text-[10px] hidden sm:inline">지도</span>
                        </a>
                      </div>
                    </div>

                    <!-- Title & Description -->
                    <h4 class="text-sm sm:text-base font-bold text-zinc-100 tracking-tight">${stop.title}</h4>
                    ${stop.desc ? `<p class="text-xs sm:text-sm text-zinc-400 mt-1 leading-relaxed">${stop.desc}</p>` : ''}

                    <!-- Route Subchips -->
                    ${stop.route && stop.route.length > 0 ? `
                      <div class="flex flex-wrap items-center gap-1.5 mt-3 pt-3 border-t border-zinc-800/80">
                        ${stop.route.map((r, idx) => `
                          <span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-zinc-800/80 border border-zinc-700/60 text-zinc-300">
                            ${r}
                          </span>
                          ${idx < stop.route.length - 1 ? `<span class="text-zinc-600 text-xs">→</span>` : ''}
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    // 팁 렌더링
    function renderTips() {
      const { tips } = TRIP_DATA;
      const container = document.getElementById('tips-list');

      container.innerHTML = tips.map(t => `
        <div class="bg-zinc-900/50 rounded-2xl p-4 sm:p-5 border border-zinc-800/80 hover:border-zinc-700 transition flex items-start gap-3.5">
          <div class="text-2xl flex-shrink-0 w-10 h-10 rounded-xl bg-zinc-800/80 flex items-center justify-center border border-zinc-700/60">
            ${t.icon}
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="text-sm font-bold text-zinc-100">${t.title}</h4>
            <p class="text-xs sm:text-sm text-zinc-400 mt-0.5 leading-relaxed">${t.desc}</p>
          </div>
        </div>
      `).join('');
    }

    // 날씨 위젯 HTML 생성
    function renderWeatherSnippet(w) {
      if (!w) return `<span class="text-zinc-500 text-xs">날씨 확인 중...</span>`;
      const isHighRain = (w.rainProb >= 70 || w.rainAmount >= 30);
      return `
        <span class="text-xl leading-none">${w.icon || '🌦️'}</span>
        <div class="flex flex-col text-right">
          <div class="flex items-center gap-1.5 justify-end">
            <span class="font-bold text-zinc-200 text-xs">${w.condition}</span>
            <span class="font-mono text-zinc-400 text-xs font-semibold">${w.tempMax}° / ${w.tempMin}°</span>
          </div>
          <div class="flex items-center gap-1 justify-end text-[11px] ${isHighRain ? 'text-amber-400 font-bold' : 'text-zinc-400'}">
            <span>💧 강수 ${w.rainProb}%</span>
            <span>(${w.rainAmount}mm)</span>
          </div>
        </div>
      `;
    }

    // WMO 날씨 코드를 한국어 및 이모지로 변환
    function parseWmoWeather(code) {
      if (code === 0) return { condition: "맑음", icon: "☀️" };
      if (code === 1 || code === 2) return { condition: "대체로 맑음", icon: "🌤️" };
      if (code === 3) return { condition: "흐림", icon: "☁️" };
      if (code === 45 || code === 48) return { condition: "안개", icon: "🌫️" };
      if (code >= 51 && code <= 55) return { condition: "약한 이슬비", icon: "🌦️" };
      if (code >= 61 && code <= 65) return { condition: "비", icon: "🌧️" };
      if (code >= 80 && code <= 82) return { condition: "소나기", icon: "🌧️" };
      if (code >= 95) return { condition: "뇌우 / 비바람", icon: "⛈️" };
      return { condition: "비 / 흐림", icon: "🌦️" };
    }

    // Open-Meteo API를 통한 실시간 다낭 날씨 연동
    async function fetchLiveWeather() {
      try {
        // 다낭 좌표 (위도 16.0544, 경도 108.2022) 14일 예보
        const apiUrl = 'https://api.open-meteo.com/v1/forecast?latitude=16.0544&longitude=108.2022&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&forecast_days=14&timezone=Asia%2FBangkok';
        const res = await fetch(apiUrl);
        if (!res.ok) return;

        const data = await res.json();
        if (!data || !data.daily || !data.daily.time) return;

        const { time, weathercode, temperature_2m_max, temperature_2m_min, precipitation_sum, precipitation_probability_max } = data.daily;

        // 여행 각 일자별로 날짜 매칭
        TRIP_DATA.days.forEach(day => {
          if (!day.isoDate) return;
          const idx = time.indexOf(day.isoDate);
          if (idx !== -1) {
            const wmo = parseWmoWeather(weathercode[idx]);
            day.weather = {
              condition: wmo.condition,
              icon: wmo.icon,
              tempMax: Math.round(temperature_2m_max[idx]),
              tempMin: Math.round(temperature_2m_min[idx]),
              rainProb: precipitation_probability_max[idx] ?? 0,
              rainAmount: Math.round((precipitation_sum[idx] ?? 0) * 10) / 10
            };

            // DOM 위젯 업데이트
            const el = document.getElementById(`weather-day-${day.day}`);
            if (el) {
              el.innerHTML = renderWeatherSnippet(day.weather);
            }
          }
        });
      } catch (err) {
        console.warn('실시간 날씨 API 연동 실패, 기본 캐시 데이터를 유지합니다:', err);
      }
    }

  </script>
</body>
</html>
